name: gitleaks

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

# The mechanical version of the house rule "before any public flip, scan
# history for kitchen filenames and secrets": full history, every push.
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
