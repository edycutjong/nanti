<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Nanti — The amber one-ad tab under a delivered letter turns green the instant RevenueCat verifies the reward.">
<!-- STORYBOARD (dur 8s — must equal this file's single master dur)
  0-14%   steady state: plate + grid + aurora, mini mark, outlined Nan|ti wordmark, tagline, metric + tech lines; right: the delivered letter with the amber outline tab "Tab: 1 ad owed · pay later", the RevenueCat ring and the dashed route between them — all visible at t=0 (poster rule)
  14-34%  trigger:      the user settles: an amber comet leaves the tab along the route to the RevenueCat ring (the rewarded ad plays, AdMob SSV calls RevenueCat); caption "watch 1 rewarded ad (~20 s) → AdMob SSV"        data-story="beat-2"
  32-52%  mechanism:    The amber one-ad tab under a delivered letter turns green the instant RevenueCat verifies the reward.        data-story="beat-3"
  50-92%  resolution:   the tab STAYS green ("Settled · ADS 0 → 1"), the ring stays green, the receipt lines persist, the beam sweeps once (it lifts measured ink ~5% while crossing 56-84%), the mini mark's tab echoes green        data-story="beat-4"
  92-100% breathe + seam fade: story layers fade out 92-98% and hold at 0 so the loop restarts on the amber poster without a hard cut (rules 5-7)
-->
  <defs>
    <clipPath id="plateClip"><rect width="1280" height="320" rx="28"/></clipPath>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 L0 0 0 64" fill="none" stroke="#F3F4F6" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="wordG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="shimmerG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFDF7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFDF7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFDF7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tiClip"><path d="M33.6 0L21.8 0Q17.7 0 15.2-2.6Q12.6-5.1 12.6-9.4L12.6-9.4L12.6-32.9L2.2-32.9L2.2-41.7L12.6-41.7L12.6-54.6L23.2-54.6L23.2-41.7L34.6-41.7L34.6-32.9L23.2-32.9L23.2-11.3Q23.2-8.7 25.5-8.7L25.5-8.7L33.6-8.7L33.6 0ZM54.8 0L44.2 0L44.2-41.7L54.8-41.7L54.8 0ZM49.5-46.5L49.5-46.5Q46.6-46.5 44.6-48.4Q42.7-50.2 42.7-53.3L42.7-53.3Q42.7-56.3 44.6-58.1Q46.6-60.0 49.5-60.0L49.5-60.0Q52.4-60.0 54.3-58.1Q56.3-56.3 56.3-53.3L56.3-53.3Q56.3-50.2 54.3-48.4Q52.4-46.5 49.5-46.5Z"/></clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="soft" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-30%" y="-120%" width="160%" height="340%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="paperShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <style>
    .aur1 { animation: drift1 16s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .aur2 { animation: drift2 19s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 8s ease-in-out infinite; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(-70px, -26px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-50px, 34px); } }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.62; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#plateClip)">
    <!-- backdrop: plate (mandatory — self-sufficient on light AND dark GitHub) + grid + aurora -->
    <rect width="1280" height="320" rx="28" fill="#0F1419"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle class="aur1" cx="880" cy="330" r="190" fill="#F2A93B" fill-opacity="0.16" filter="url(#blur)"/>
    <circle class="aur2" cx="1190" cy="10" r="150" fill="#34D399" fill-opacity="0.12" filter="url(#blur)"/>

    <!-- beat-4: one skewed beam sweep per loop -->
    <rect x="-320" y="-60" width="200" height="440" fill="url(#beamG)" transform="skewX(-18)" opacity="0" data-story="beat-4">
      <animate attributeName="x" values="-320;-320;1500;1500" keyTimes="0;0.56;0.84;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.28;0.28;0;0" keyTimes="0;0.56;0.58;0.82;0.84;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- ================= LEFT: brand (all visible at t=0) ================= -->
    <!-- mini animated mark: the static icon geometry at 96px; its tab echoes the settle -->
    <g transform="translate(56,44) scale(0.1875)">
      <rect width="512" height="512" rx="112" fill="#1A2027"/>
      <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
      <rect x="118" y="84" width="232" height="340" rx="16" fill="#FFFDF7"/>
      <g fill="#171B22">
        <rect x="228" y="116" width="92" height="12" rx="6" opacity="0.5"/>
        <rect x="148" y="152" width="144" height="13" rx="6.5" opacity="0.74"/>
        <rect x="148" y="184" width="134" height="12" rx="6" opacity="0.42"/>
        <rect x="148" y="228" width="172" height="12" rx="6" opacity="0.28"/>
        <rect x="148" y="254" width="172" height="12" rx="6" opacity="0.28"/>
        <rect x="148" y="376" width="74" height="12" rx="6" opacity="0.6"/>
      </g>
      <rect x="262" y="300" width="172" height="68" rx="34" fill="#F2A93B"/>
      <rect x="262" y="300" width="172" height="68" rx="34" fill="#34D399" opacity="0" data-story="beat-3">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.47;0.92;0.98;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <path d="M337 316 L371 334 L337 352 Z" fill="#171B22" opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.42;0.47;0.92;0.98;1" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M318 334 L341 356 L382 312" fill="none" stroke="#171B22" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0" data-story="beat-3">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.48;0.92;0.98;1" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- outlined wordmark: Space Grotesk 700, size 84 (cap height 59px) — Nan near-white, ti in the owed→settled gradient -->
    <g transform="translate(176,118)">
      <path d="M16.5 0L5.5 0L5.5-58.8L26.6-58.8L38.3-7.6L39.8-7.6L39.8-58.8L50.7-58.8L50.7 0L29.7 0L18.0-51.2L16.5-51.2L16.5 0ZM75.1 1.2L75.1 1.2Q70.6 1.2 67.1-0.4Q63.6-1.9 61.5-4.9Q59.5-7.9 59.5-12.2L59.5-12.2Q59.5-16.5 61.5-19.4Q63.6-22.3 67.2-23.7Q70.9-25.2 75.6-25.2L75.6-25.2L87.0-25.2L87.0-27.6Q87.0-30.5 85.2-32.4Q83.3-34.3 79.3-34.3L79.3-34.3Q75.3-34.3 73.4-32.5Q71.5-30.7 70.9-27.8L70.9-27.8L61.2-31.1Q62.2-34.3 64.4-36.9Q66.6-39.6 70.3-41.2Q74.1-42.8 79.5-42.8L79.5-42.8Q87.7-42.8 92.5-38.7Q97.3-34.6 97.3-26.8L97.3-26.8L97.3-11.3Q97.3-8.7 99.6-8.7L99.6-8.7L103.0-8.7L103.0 0L95.9 0Q92.8 0 90.8-1.5Q88.8-3.0 88.8-5.5L88.8-5.5L88.8-5.6L87.2-5.6Q86.9-4.6 85.7-3.0Q84.5-1.3 82.0-0.1Q79.5 1.2 75.1 1.2ZM76.9-7.4L76.9-7.4Q81.4-7.4 84.2-9.9Q87.0-12.3 87.0-16.5L87.0-16.5L87.0-17.3L76.4-17.3Q73.4-17.3 71.7-16.0Q70.1-14.8 70.1-12.5L70.1-12.5Q70.1-10.2 71.8-8.8Q73.6-7.4 76.9-7.4ZM121.3 0L110.7 0L110.7-41.7L121.1-41.7L121.1-36.2L122.6-36.2Q123.6-38.4 126.4-40.4Q129.2-42.3 134.8-42.3L134.8-42.3Q139.7-42.3 143.3-40.1Q147-37.9 149.0-34.0Q151.0-30.1 151.0-24.9L151.0-24.9L151.0 0L140.4 0L140.4-24.0Q140.4-28.7 138.1-31.1Q135.8-33.4 131.5-33.4L131.5-33.4Q126.7-33.4 124.0-30.2Q121.3-27.0 121.3-21.2L121.3-21.2L121.3 0Z" fill="#F3F4F6"/>
    </g>
    <g transform="translate(336.6,118)">
      <path d="M33.6 0L21.8 0Q17.7 0 15.2-2.6Q12.6-5.1 12.6-9.4L12.6-9.4L12.6-32.9L2.2-32.9L2.2-41.7L12.6-41.7L12.6-54.6L23.2-54.6L23.2-41.7L34.6-41.7L34.6-32.9L23.2-32.9L23.2-11.3Q23.2-8.7 25.5-8.7L25.5-8.7L33.6-8.7L33.6 0ZM54.8 0L44.2 0L44.2-41.7L54.8-41.7L54.8 0ZM49.5-46.5L49.5-46.5Q46.6-46.5 44.6-48.4Q42.7-50.2 42.7-53.3L42.7-53.3Q42.7-56.3 44.6-58.1Q46.6-60.0 49.5-60.0L49.5-60.0Q52.4-60.0 54.3-58.1Q56.3-56.3 56.3-53.3L56.3-53.3Q56.3-50.2 54.3-48.4Q52.4-46.5 49.5-46.5Z" fill="url(#wordG)"/>
      <g clip-path="url(#tiClip)">
        <rect x="-60" y="-72" width="30" height="84" fill="url(#shimmerG)" transform="skewX(-22)">
          <animate attributeName="x" values="-60;-60;120;120" keyTimes="0;0.20;0.34;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <text x="176" y="156" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="21" font-weight="600" fill="#F3F4F6">The letter now. The ad later.</text>
    <text class="pulse" x="176" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#F2A93B">1 ad owed · never 2</text>
    <text x="176" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#34D399">settled by RevenueCat, not by the app</text>
    <text x="176" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">Expo · React Native · TypeScript</text>
    <text x="176" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94A3B8">RevenueCat Ads · AdMob SSV · Google Play</text>

    <!-- ================= RIGHT: the product story ================= -->
    <!-- the delivered letter (visible at t=0) -->
    <g transform="translate(600,34) rotate(-3 100 126)">
      <rect x="0" y="0" width="200" height="252" rx="8" fill="#FFFDF7" filter="url(#paperShadow)"/>
      <rect x="8" y="0" width="184" height="2" fill="#FFFFFF" fill-opacity="0.9"/>
      <text x="182" y="27" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9" fill="#171B22" fill-opacity="0.62">Jakarta, 15 September 2026</text>
      <g fill="#171B22">
        <rect x="22" y="44" width="112" height="6" rx="3" opacity="0.74"/>
        <rect x="22" y="62" width="70" height="5" rx="2.5" opacity="0.42"/>
        <rect x="22" y="75" width="100" height="5" rx="2.5" opacity="0.42"/>
        <rect x="22" y="100" width="156" height="5" rx="2.5" opacity="0.28"/>
        <rect x="22" y="113" width="156" height="5" rx="2.5" opacity="0.28"/>
        <rect x="22" y="126" width="156" height="5" rx="2.5" opacity="0.28"/>
        <rect x="22" y="139" width="118" height="5" rx="2.5" opacity="0.28"/>
        <rect x="22" y="164" width="156" height="5" rx="2.5" opacity="0.28"/>
        <rect x="22" y="177" width="92" height="5" rx="2.5" opacity="0.28"/>
        <rect x="22" y="222" width="58" height="6" rx="3" opacity="0.6"/>
      </g>
    </g>

    <!-- the route from the tab to RevenueCat (visible at t=0) -->
    <path d="M1004 219 C 1050 219, 1080 190, 1118 158" fill="none" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 6"/>

    <!-- RevenueCat ring (visible at t=0); turns green on the verified reward -->
    <g transform="translate(1150,130)">
      <circle r="42" fill="#1A2027" stroke="#94A3B8" stroke-width="1.5"/>
      <g fill="none" stroke="#94A3B8" stroke-width="2">
        <rect x="-16" y="-19" width="32" height="10" rx="3"/>
        <rect x="-16" y="-5" width="32" height="10" rx="3"/>
        <rect x="-16" y="9" width="32" height="10" rx="3"/>
      </g>
      <circle cx="10" cy="-14" r="1.8" fill="#F2A93B"/>
      <circle cx="10" cy="0" r="1.8" fill="#F2A93B"/>
      <circle cx="10" cy="14" r="1.8" fill="#F2A93B"/>
      <circle r="42" fill="none" stroke="#34D399" stroke-width="2.5" opacity="0" data-story="beat-3">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.36;0.92;0.98;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="42" fill="none" stroke="#34D399" stroke-width="3" opacity="0" data-story="beat-3">
        <animate attributeName="r" values="42;42;96;96" keyTimes="0;0.32;0.46;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.32;0.34;0.46;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#94A3B8">RevenueCat</text>
      <text y="82" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#94A3B8">AdMob SSV → ADS +1</text>
    </g>

    <!-- the tab, hanging off the letter's right edge (owed outline visible at t=0) -->
    <g transform="translate(748,196)">
      <rect x="0" y="0" width="256" height="46" rx="23" fill="#F2A93B" fill-opacity="0.12" stroke="#F2A93B" stroke-width="2"/>
      <circle cx="24" cy="23" r="6" fill="#F2A93B"/>
      <text x="42" y="29" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F2A93B">Tab: 1 ad owed · pay later</text>
      <!-- beat-4: glow breath under the settled fill -->
      <rect x="0" y="0" width="256" height="46" rx="23" fill="#34D399" filter="url(#glow)" opacity="0" data-story="beat-4">
        <animate attributeName="opacity" values="0;0;0.55;0.25;0.55;0.25;0.5;0;0" keyTimes="0;0.46;0.54;0.64;0.74;0.84;0.90;0.97;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <!-- beat-3: settled fill + label -->
      <g opacity="0" data-story="beat-3">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.47;0.92;0.98;1" dur="8s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="256" height="46" rx="23" fill="#34D399" stroke="#34D399" stroke-width="2"/>
        <text x="48" y="29" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#171B22">Settled · ADS 0 → 1</text>
      </g>
      <path d="M15 23 L23 31 L36 15" fill="none" stroke="#171B22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0" data-story="beat-3">
        <animate attributeName="stroke-dashoffset" values="100;100;0;0;0" keyTimes="0;0.44;0.52;0.98;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.45;0.92;0.98;1" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- beat-2: caption while the ad plays -->
    <text x="748" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#F2A93B" opacity="0" data-story="beat-2">watch 1 rewarded ad (~20 s) → AdMob SSV<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.18;0.32;0.36;1" dur="8s" repeatCount="indefinite"/></text>

    <!-- beat-2: amber comet from the tab to RevenueCat (the ad plays; SSV reports) -->
    <g opacity="0" data-story="beat-2">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.16;0.30;0.33;1" dur="8s" repeatCount="indefinite"/>
      <circle r="8" fill="#F2A93B" filter="url(#soft)"/>
      <circle r="3.5" fill="#FFFDF7"/>
      <animateMotion path="M1004 219 C 1050 219, 1080 190, 1118 158" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.14;0.32;1"/>
    </g>

    <!-- beat-3: green comet back from RevenueCat to the tab (the verified reward) -->
    <g opacity="0" data-story="beat-3">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.43;0.46;1" dur="8s" repeatCount="indefinite"/>
      <circle r="8" fill="#34D399" filter="url(#soft)"/>
      <circle r="3.5" fill="#FFFDF7"/>
      <animateMotion path="M1004 219 C 1050 219, 1080 190, 1118 158" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.34;0.44;1"/>
    </g>

    <!-- beat-4: the receipt — what the app actually reads -->
    <text x="748" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#34D399" opacity="0" data-story="beat-4">pollRewardVerification → reward.type = virtual_currency · ADS +1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.54;0.92;0.98;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="748" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8" opacity="0" data-story="beat-4">debt = clamp(exported − ADS, 0, 1) = 0 → the tab clears<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.54;0.58;0.92;0.98;1" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <!-- rim -->
  <rect x="0.5" y="0.5" width="1279" height="319" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
